name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs for the same ref (e.g. a newer push to a PR branch).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: typecheck + conformance + build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match the local runtime (Node 24; Vite 8 needs >=22.12).
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # npm test = tsc --noEmit && node tests/comment-persistence.mjs
      # The conformance test guards the live-mode persistence regression:
      # comment/thread POSTs must carry postedById (mutation-proven).
      - name: Typecheck + conformance test
        run: npm test

      - name: Build
        run: npm run build
