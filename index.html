<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Assembly UI - Intelligence & Governance Platform</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=PT+Sans:wght@400;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
</head>
<body class="antialiased selection:bg-indigo-500 selection:text-white min-h-screen">
  <div id="root">
    <!-- Boot splash: replaced when React mounts. Guarantees visible feedback
         during the (now background) live-data preload instead of a white page. -->
    <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:system-ui,sans-serif;color:#64748b;background:#f8fafc">
      <div style="width:28px;height:28px;border:3px solid #c7d2fe;border-top-color:#4f46e5;border-radius:50%;animation:a-spin 0.8s linear infinite"></div>
      <div style="font-size:14px">Loading Assembly…</div>
    </div>
    <style>@keyframes a-spin{to{transform:rotate(360deg)}}</style>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
